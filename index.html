<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Data Type Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: #f0f4f8;
            overflow-x: hidden;
            user-select: none;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-enter {
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .timer-bar {
            transition: width 1s linear;
        }
        .option-btn {
            transition: all 0.2s ease;
            transform: scale(1);
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .correct-glow {
            box-shadow: 0 0 25px #10b981;
            border: 4px solid #10b981 !important;
            background-color: #059669 !important;
            z-index: 10;
            transform: scale(1.05);
        }
        .wrong-glow {
            box-shadow: 0 0 20px #ef4444;
            border: 4px solid #ef4444 !important;
            opacity: 0.7;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Popup Styles */
        #wrong-answer-popup {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="game-container" class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden min-h-[550px] flex flex-col relative">
        
        <!-- Screen: Start -->
        <div id="screen-start" class="flex-1 flex flex-col items-center justify-center p-8 text-center">
            <div class="mb-6 bg-yellow-100 p-4 rounded-full animate-bounce">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-yellow-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Python Data Master</h1>
            <p class="text-gray-600 mb-8">Classify the data types to win points!</p>
            
            <div class="w-full max-w-xs space-y-4">
                <label class="block text-sm font-semibold text-gray-500 uppercase tracking-wider">How many questions?</label>
                <div class="flex justify-between gap-2">
                    <button onclick="setQuestions(5)" class="q-count-btn flex-1 py-3 rounded-xl border-2 border-indigo-100 hover:border-indigo-500 hover:bg-indigo-50 font-bold text-indigo-600">5</button>
                    <button onclick="setQuestions(10)" class="q-count-btn flex-1 py-3 rounded-xl border-2 border-indigo-500 bg-indigo-500 text-white font-bold shadow-lg">10</button>
                    <button onclick="setQuestions(15)" class="q-count-btn flex-1 py-3 rounded-xl border-2 border-indigo-100 hover:border-indigo-500 hover:bg-indigo-50 font-bold text-indigo-600">15</button>
                </div>
                
                <div class="space-y-2 pt-4">
                    <button onclick="startGame(false)" class="w-full gradient-bg text-white py-4 rounded-2xl font-bold text-xl shadow-lg hover:opacity-90 transition-opacity">
                        START MATCH 🎵
                    </button>
                    <button id="ai-generate-btn" onclick="startGame(true)" class="w-full bg-indigo-100 text-indigo-700 py-3 rounded-2xl font-bold hover:bg-indigo-200 transition-colors flex items-center justify-center gap-2">
                        <span id="ai-btn-text">✨ Generate AI Match</span>
                        <div id="ai-btn-loader" class="loader hidden"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Screen: Quiz -->
        <div id="screen-quiz" class="hidden flex-1 flex flex-col">
            <div class="p-4 flex justify-between items-center border-b border-gray-100 bg-gray-50">
                <div class="font-bold text-indigo-600 text-lg">Question <span id="current-index">1</span>/<span id="total-index">10</span></div>
                <div class="bg-indigo-100 px-4 py-1 rounded-full font-bold text-indigo-700">Score: <span id="current-score">0</span></div>
            </div>
            
            <div class="w-full h-3 bg-gray-200">
                <div id="timer-bar" class="h-full bg-emerald-500 timer-bar" style="width: 100%"></div>
            </div>

            <div class="flex-1 p-8 flex flex-col items-center justify-center relative">
                <div id="question-card" class="card-enter w-full bg-indigo-50 rounded-2xl p-10 mb-6 text-center border-b-4 border-indigo-200 relative">
                    <span class="text-sm uppercase font-bold text-indigo-400 block mb-2" id="card-label">Classify this:</span>
                    <code id="data-value" class="text-5xl font-mono font-bold text-indigo-900 break-all">42</code>
                </div>

                <div id="options-grid" class="grid grid-cols-2 gap-4 w-full">
                    <button data-type="int" onclick="checkAnswer('int')" class="option-btn bg-blue-500 text-white p-6 rounded-2xl font-bold text-lg shadow-md hover:bg-blue-600 border-4 border-transparent">
                        int
                    </button>
                    <button data-type="float" onclick="checkAnswer('float')" class="option-btn bg-emerald-500 text-white p-6 rounded-2xl font-bold text-lg shadow-md hover:bg-emerald-600 border-4 border-transparent">
                        float
                    </button>
                    <button data-type="str" onclick="checkAnswer('str')" class="option-btn bg-amber-500 text-white p-6 rounded-2xl font-bold text-lg shadow-md hover:bg-amber-600 border-4 border-transparent">
                        string
                    </button>
                    <button data-type="bool" onclick="checkAnswer('bool')" class="option-btn bg-purple-500 text-white p-6 rounded-2xl font-bold text-lg shadow-md hover:bg-purple-600 border-4 border-transparent">
                        boolean
                    </button>
                </div>

                <!-- Wrong Answer Popup -->
                <div id="wrong-answer-popup" class="absolute inset-0 z-50 flex items-center justify-center p-6 hidden">
                    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm border-t-8 border-red-500 text-center scale-90 opacity-0 transform transition-all duration-300" id="popup-content">
                        <div class="text-red-500 mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 mb-2">Not Quite!</h3>
                        
                        <div class="bg-gray-50 rounded-xl p-4 mb-4 text-left border border-gray-100">
                            <div class="text-xs uppercase font-bold text-gray-400 mb-1">The Question:</div>
                            <code id="popup-question-val" class="text-lg font-mono font-bold text-gray-700">""</code>
                        </div>

                        <p class="text-gray-500 text-sm mb-2">The correct data type was:</p>
                        <div class="inline-block px-6 py-2 rounded-full font-mono font-bold text-xl bg-indigo-100 text-indigo-700 mb-6" id="popup-correct-type">
                            int
                        </div>
                        <button onclick="dismissPopup()" class="w-full py-3 bg-gray-800 text-white rounded-xl font-bold hover:bg-gray-700 transition-colors">
                            Next Question
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Screen: Result -->
        <div id="screen-result" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Match Finished!</h2>
            <div id="result-trophy" class="text-7xl mb-4">🏆</div>
            <div class="text-7xl font-black text-indigo-600 mb-2" id="final-score">100</div>
            <p class="text-xl text-gray-600 mb-8" id="result-feedback">You're a Python Pro!</p>
            
            <button onclick="resetToHome()" class="px-8 py-4 bg-gray-800 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-gray-700 transition-colors">
                Play Again
            </button>
        </div>

    </div>

    <!-- Feedback Message Overlay -->
    <div id="feedback-toast" class="fixed top-10 left-1/2 -translate-x-1/2 transform scale-0 transition-all duration-300 pointer-events-none px-8 py-4 rounded-full font-bold text-white shadow-2xl z-50 text-xl text-center min-w-[200px]">
        Correct! +10
    </div>

    <script>
        const apiKey = ""; 
        const defaultPool = [
            { v: "10", t: "int" }, { v: "-5", t: "int" }, { v: "0", t: "int" }, { v: "999", t: "int" },
            { v: "3.14", t: "float" }, { v: "-0.5", t: "float" }, { v: "2.0", t: "float" }, { v: "0.001", t: "float" },
            { v: '"Hello"', t: "str" }, { v: "'Python'", t: "str" }, { v: '"42"', t: "str" }, { v: '""', t: "str" },
            { v: "True", t: "bool" }, { v: "False", t: "bool" }
        ];

        let gameState = {
            totalQuestions: 10,
            currentIndex: 0,
            score: 0,
            timeLeft: 10,
            timer: null,
            questions: [],
            isAnswering: false,
            audioContext: null
        };

        const screens = {
            start: document.getElementById('screen-start'),
            quiz: document.getElementById('screen-quiz'),
            result: document.getElementById('screen-result')
        };

        // --- GEMINI API INTEGRATION ---
        async function geminiFetch(prompt, systemInstruction = "", useJson = false) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
                generationConfig: useJson ? { responseMimeType: "application/json" } : undefined
            };
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) {
                    await new Promise(r => setTimeout(r, delays[retries]));
                    retries++;
                }
            }
            throw new Error("API limit reached");
        }

        async function generateAiQuestions(count) {
            const prompt = `Generate ${count} Python data classification questions. Include 'int', 'float', 'str', and 'bool'. Return JSON array of objects: {v: valueString, t: typeString}.`;
            const system = "You are a Python teacher. Return ONLY valid JSON.";
            const response = await geminiFetch(prompt, system, true);
            return JSON.parse(response);
        }

        // --- AUDIO ENGINE ---
        function initAudio() {
            if (gameState.audioContext) return;
            gameState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            const melodyGain = gameState.audioContext.createGain();
            melodyGain.gain.setValueAtTime(0.4, gameState.audioContext.currentTime);
            melodyGain.connect(gameState.audioContext.destination);

            const melody = [659.25, 739.99, 830.61, 987.77, 830.61, 739.99, 659.25, 493.88, 554.37, 659.25, 554.37, 493.88];
            const bass = [164.81, 220.00, 246.94, 220.00];

            let step = 0;
            const playPianoNote = (freq, vol, decay) => {
                const osc = gameState.audioContext.createOscillator();
                const g = gameState.audioContext.createGain();
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(freq, gameState.audioContext.currentTime);
                g.gain.setValueAtTime(vol, gameState.audioContext.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, gameState.audioContext.currentTime + decay);
                osc.connect(g);
                g.connect(melodyGain);
                osc.start();
                osc.stop(gameState.audioContext.currentTime + decay);
            };

            setInterval(() => {
                if (screens.quiz.classList.contains('hidden') && screens.start.classList.contains('hidden')) return;
                playPianoNote(melody[step % melody.length], 0.25, 0.8);
                if (step % 4 === 0) playPianoNote(bass[(step / 4) % bass.length], 0.15, 1.5);
                step++;
            }, 400);
        }

        function playTick() {
            if (!gameState.audioContext) return;
            const now = gameState.audioContext.currentTime;
            const osc = gameState.audioContext.createOscillator();
            const g = gameState.audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            g.gain.setValueAtTime(0.01, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(g);
            g.connect(gameState.audioContext.destination);
            osc.start();
            osc.stop(now + 0.05);
        }

        function playFeedback(isCorrect) {
            if (!gameState.audioContext) return;
            const now = gameState.audioContext.currentTime;
            const osc = gameState.audioContext.createOscillator();
            const g = gameState.audioContext.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(isCorrect ? 523.25 : 120, now);
            if(isCorrect) osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.2);
            g.gain.setValueAtTime(0.08, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(g);
            g.connect(gameState.audioContext.destination);
            osc.start();
            osc.stop(now + 0.5);
        }

        // --- GAME FLOW ---
        function setQuestions(num) {
            gameState.totalQuestions = num;
            document.querySelectorAll('.q-count-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-500', 'text-white', 'shadow-lg');
                btn.classList.add('border-indigo-100', 'text-indigo-600');
                if(parseInt(btn.innerText) === num) {
                    btn.classList.remove('border-indigo-100', 'text-indigo-600');
                    btn.classList.add('bg-indigo-500', 'text-white', 'shadow-lg');
                }
            });
        }

        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[name].classList.remove('hidden');
        }

        async function startGame(useAi = false) {
            initAudio();
            if (useAi) {
                const btnText = document.getElementById('ai-btn-text');
                const btnLoader = document.getElementById('ai-btn-loader');
                btnText.classList.add('hidden'); btnLoader.classList.remove('hidden');
                try {
                    gameState.questions = await generateAiQuestions(gameState.totalQuestions);
                } catch (e) {
                    gameState.questions = [...defaultPool].sort(() => 0.5 - Math.random()).slice(0, gameState.totalQuestions);
                }
                btnText.classList.remove('hidden'); btnLoader.classList.add('hidden');
            } else {
                gameState.questions = [...defaultPool].sort(() => 0.5 - Math.random()).slice(0, gameState.totalQuestions);
            }
            gameState.score = 0;
            gameState.currentIndex = 0;
            document.getElementById('total-index').innerText = gameState.totalQuestions;
            document.getElementById('current-score').innerText = "0";
            showScreen('quiz');
            loadQuestion();
        }

        function loadQuestion() {
            if(gameState.currentIndex >= gameState.totalQuestions) { endGame(); return; }
            gameState.isAnswering = false;
            const q = gameState.questions[gameState.currentIndex];
            
            document.getElementById('current-index').innerText = gameState.currentIndex + 1;
            document.getElementById('data-value').innerText = q.v;
            document.getElementById('card-label').innerText = "Classify this:";
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('correct-glow', 'wrong-glow', 'opacity-50');
                btn.disabled = false;
            });
            document.getElementById('wrong-answer-popup').classList.add('hidden');
            
            const card = document.getElementById('question-card');
            card.classList.remove('card-enter');
            void card.offsetWidth;
            card.classList.add('card-enter');
            startTimer();
        }

        function startTimer() {
            clearInterval(gameState.timer);
            gameState.timeLeft = 10;
            updateTimerUI();
            playTick();
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                updateTimerUI();
                if(gameState.timeLeft > 0 && !gameState.isAnswering) playTick();
                if(gameState.timeLeft <= 0) checkAnswer(null);
            }, 1000);
        }

        function updateTimerUI() {
            const bar = document.getElementById('timer-bar');
            const perc = (gameState.timeLeft / 10) * 100;
            bar.style.width = perc + '%';
            bar.className = `h-full timer-bar ${perc > 50 ? 'bg-emerald-500' : perc > 20 ? 'bg-amber-500' : 'bg-red-500'}`;
        }

        function checkAnswer(selectedType) {
            if(gameState.isAnswering) return;
            gameState.isAnswering = true;
            clearInterval(gameState.timer);

            const qObj = gameState.questions[gameState.currentIndex];
            const correctType = qObj.t;
            const questionValue = qObj.v;
            const isCorrect = selectedType === correctType;
            const toast = document.getElementById('feedback-toast');

            playFeedback(isCorrect);

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                const btnType = btn.getAttribute('data-type');
                if (btnType === correctType) btn.classList.add('correct-glow');
                else if (btnType === selectedType) btn.classList.add('wrong-glow');
                else btn.classList.add('opacity-50');
            });

            if(isCorrect) {
                gameState.score += 10;
                document.getElementById('current-score').innerText = gameState.score;
                toast.innerText = "Correct! +10";
                toast.className = "fixed top-10 left-1/2 -translate-x-1/2 scale-100 transition-all px-8 py-4 rounded-full font-bold text-white shadow-2xl z-50 bg-emerald-500 text-xl";
                
                setTimeout(() => {
                    toast.classList.replace('scale-100', 'scale-0');
                    gameState.currentIndex++;
                    loadQuestion();
                }, 1500);
            } else {
                showWrongAnswerPopup(questionValue, correctType);
            }
        }

        function showWrongAnswerPopup(questionValue, correctType) {
            const popup = document.getElementById('wrong-answer-popup');
            const content = document.getElementById('popup-content');
            
            document.getElementById('popup-question-val').innerText = questionValue;
            document.getElementById('popup-correct-type').innerText = correctType;
            
            popup.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-90', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function dismissPopup() {
            const content = document.getElementById('popup-content');
            content.classList.add('scale-90', 'opacity-0');
            content.classList.remove('scale-100', 'opacity-100');
            
            setTimeout(() => {
                document.getElementById('wrong-answer-popup').classList.add('hidden');
                gameState.currentIndex++;
                loadQuestion();
            }, 300);
        }

        function endGame() {
            showScreen('result');
            document.getElementById('final-score').innerText = gameState.score;
            const ratio = gameState.score / (gameState.totalQuestions * 10);
            document.getElementById('result-feedback').innerText = ratio >= 1 ? "Perfect! You're a Master!" : ratio >= 0.5 ? "Great job!" : "Keep practicing!";
            document.getElementById('result-trophy').innerText = ratio >= 1 ? "👑" : ratio >= 0.5 ? "🏆" : "⭐";
        }

        function resetToHome() { showScreen('start'); }
    </script>
</body>
</html>
